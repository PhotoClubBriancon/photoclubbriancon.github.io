<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<title>Télécharger LightCraft Windows — Photo Club Briançonnais</title>
<style>body{font:1.1rem system-ui;background:#151412;color:#eee;max-width:42rem;margin:12vh auto;padding:24px;line-height:1.6}a{color:#d2b271}button{font:inherit;padding:12px 20px;cursor:pointer}h1{color:#d2b271}</style>
<h1>LightCraft pour Windows 64 bits</h1>
<p id="status" role="status" aria-live="polite">Recherche de la dernière version stable…</p>
<p><a id="download" hidden>Télécharger l’installateur officiel</a></p>
<button id="retry" hidden>Réessayer</button>
<p><a href="https://github.com/storytold/lightcraft/releases/latest" target="_blank" rel="noopener noreferrer">Consulter la version officielle sur GitHub</a></p>
<p><a href="outils-club.html">Retour aux outils du club</a></p>
<noscript>Activez JavaScript pour sélectionner automatiquement Windows x64, ou consultez la version officielle ci-dessus.</noscript>
<script>
function selectInstaller(release) {
    if (!release || release.draft !== false || release.prerelease !== false || !/^v?\d+\.\d+\.\d+$/.test(release.tag_name) || !Array.isArray(release.assets)) throw new Error('Version stable indisponible');
    const name = 'lightcraft-' + release.tag_name.replace(/^v/, '') + '-windows-x64.msi';
    const expected = 'https://github.com/storytold/lightcraft/releases/download/' + release.tag_name + '/' + name;
    const matches = release.assets.filter(asset => asset.name === name && asset.state === 'uploaded' && asset.size > 0 && asset.browser_download_url === expected);
    if (matches.length !== 1) throw new Error('Installateur Windows x64 indisponible');
    return matches[0].browser_download_url;
}
async function downloadLatest() {
    const status = document.getElementById('status');
    const link = document.getElementById('download');
    const retry = document.getElementById('retry');
    retry.hidden = true;
    link.hidden = true;
    status.textContent = 'Recherche de la dernière version stable…';
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 12000);
    try {
        const response = await fetch('https://api.github.com/repos/storytold/lightcraft/releases/latest', {cache:'no-store', credentials:'omit', signal:controller.signal});
        if (!response.ok) throw new Error('GitHub indisponible');
        const release = await response.json();
        const url = selectInstaller(release);
        link.href = url;
        link.hidden = false;
        link.textContent = 'Télécharger LightCraft ' + release.tag_name + ' — Windows x64';
        status.textContent = 'Version ' + release.tag_name + ' trouvée. Le téléchargement démarre ; sinon cliquez sur le lien ci-dessous.';
        link.click();
    } catch (error) {
        status.textContent = 'Impossible de vérifier la dernière version Windows x64. Aucun ancien installateur n’a été téléchargé. Réessayez ou consultez GitHub.';
        retry.hidden = false;
    } finally {
        clearTimeout(timeout);
    }
}
document.getElementById('retry').addEventListener('click', downloadLatest);
downloadLatest();
</script>
</html>
